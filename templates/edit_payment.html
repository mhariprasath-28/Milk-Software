{% extends "layout.html" %}

{% block content %}

<h2>Edit Payment</h2>

<div class="card p-3">

    <form method="POST">

        <label>Date</label>
        <input type="date"
               name="payment_date"
               class="form-control"
               value="{{ payment[1] }}"
               required>

        <br>

        <label>Shop Name</label>
        <select name="shop_id" class="form-control">
            {% for shop in shops %}
            <option value="{{ shop[0] }}"
                {% if shop[0] == payment[2] %}selected{% endif %}>
                {{ shop[1] }}
            </option>
            {% endfor %}
        </select>

        <br>

        <label>Opening Balance</label>
        <input type="number"
               name="opening_balance"
               class="form-control"
               value="{{ payment[3] }}">

        <br>

        <label>Remarks</label>
        <textarea name="remarks"
                  class="form-control">{{ payment[4] }}</textarea>

        <br>

        <button type="submit"
                class="btn btn-success">
            Update
        </button>

        <a href="/payment-entry"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>



<script>

const received = document.getElementById("received");
const paid = document.getElementById("paid");
const balance = document.getElementById("balance");

function calculateBalance() {
    let r = parseFloat(received.value) || 0;
    let p = parseFloat(paid.value) || 0;
    balance.value = r - p;
}

received.addEventListener("input", calculateBalance);
paid.addEventListener("input", calculateBalance);

</script>

{% endblock %}
