{% extends "layout.html" %}

{% block content %}

<h2>Edit Entry</h2>

<div class="card p-3">

<form method="POST">

    <label>Date</label>
    <input
        type="date"
        name="entry_date"
        class="form-control"
        value="{{ rows[0][2] }}"
        required>

    <br>

    <label>Shop Name</label>
    <select name="shop_id" class="form-control">

        {% for shop in shops %}
        <option value="{{ shop[0] }}"
            {% if shop[0] == rows[0][3] %}
            selected
            {% endif %}>
            {{ shop[1] }}
        </option>
        {% endfor %}

    </select>
    <div class="alert alert-warning">
        Old Balance :
        <b>₹ {{ old_balance }}</b>
    </div>

    <input type="hidden"
           id="old_balance"
           value="{{ old_balance }}">

    <br>

    <div id="productRows">

        {% for row in rows %}

        <div class="row mb-3 product-row">

            <div class="col-md-4">

                <label>Product</label>

                <select name="product_id[]"
                        class="form-control product">

                    {% for product in products %}
                    <option value="{{ product[0] }}"
                            data-rate="{{ product[2] }}"
                            {% if product[0] == row[4] %}
                            selected
                            {% endif %}>
                        {{ product[1] }}
                    </option>
                    {% endfor %}

                </select>

            </div>

            <div class="col-md-2">

                <label>Liter</label>

                <input type="number"
                       step="0.01"
                       name="liter[]"
                       class="form-control liter"
                       value="{{ row[5] }}"
                       >

            </div>

            <div class="col-md-2">

                <label>Rate</label>

                <input type="number"
                       name="rate[]"
                       class="form-control rate"
                       value="{{ row[6] }}">

            </div>

            <div class="col-md-2">

                <label>Total</label>

                <input type="number"
                       name="total[]"
                       class="form-control total"
                       value="{{ row[7] }}"
                       readonly>

            </div>

            <div class="col-md-2">

                <label>&nbsp;</label>

                <button type="button"
                        class="btn btn-danger form-control remove-row">
                    Remove
                </button>

            </div>

        </div>

        {% endfor %}

    </div>

    <hr>

    
    <br>

    <button type="submit"
            class="btn btn-primary">
        Update Entry
    </button>

    <a href="/entry"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

</div>

<script>

function calculateRow(row) {

    let liter =
        parseFloat(row.querySelector(".liter").value) || 0;

    let rate =
        parseFloat(row.querySelector(".rate").value) || 0;

    let total = liter * rate;

    row.querySelector(".total").value = total;

    calculateBalance();
}

function calculateBalance() {

    let grandTotal = 0;

    document.querySelectorAll(".total")
        .forEach(function(item){

            grandTotal +=
                parseFloat(item.value) || 0;

        });

    let paidEl = document.getElementById("paid");

    let paid =
        paidEl ? (parseFloat(paidEl.value) || 0) : 0;

    let oldBalance =
        parseFloat(
            document.getElementById("old_balance").value
        ) || 0;

    let balanceEl = document.getElementById("balance");

    if (balanceEl) {
        balanceEl.value =
            oldBalance + grandTotal - paid;
    }
}

function attachRowEvents(row) {

    let product = row.querySelector(".product");
    let rate = row.querySelector(".rate");
    let liter = row.querySelector(".liter");
    let removeBtn = row.querySelector(".remove-row");

    product.addEventListener("change", function(){

        let selected =
            product.options[product.selectedIndex];

        rate.value =
            selected.getAttribute("data-rate") || 0;

        calculateRow(row);

    });

    rate.addEventListener("input", function(){

        calculateRow(row);

    });

    liter.addEventListener("input", function(){

        calculateRow(row);

    });

    removeBtn.addEventListener("click", function(){

        // Keep at least one product row on the form
        if (document.querySelectorAll(".product-row").length > 1) {
            row.remove();
            calculateBalance();
        } else {
            alert("At least one product row is required.");
        }

    });

}

document.querySelectorAll(".product-row")
    .forEach(function(row){
        attachRowEvents(row);
    });

let paidInput = document.getElementById("paid");
if (paidInput) {
    paidInput.addEventListener("input", calculateBalance);
}

window.onload = function () {

    calculateBalance();

};

</script>

{% endblock %}
